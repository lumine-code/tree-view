name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm may record the @lumine-code git forks with ssh URLs, but the runner
      # has no ssh key, so rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    # Run the Jasmine spec suite inside a real Lumine build; the specs exercise
    # the editor runtime (text editors, config, and service wiring).
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
      TEMP: ${{ github.workspace }}/tree-view-spec-tmp
      TMP: ${{ github.workspace }}/tree-view-spec-tmp
      TMPDIR: ${{ github.workspace }}/tree-view-spec-tmp
    steps:
      - uses: actions/checkout@v7
        with:
          path: tree-view
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key, so rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Create the private temporary directory
        run: mkdir -p "$TEMP"
      - name: Install package dependencies
        working-directory: tree-view
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Install spec dependency packages
        working-directory: lumine
        run: node script/install-spec-packages.js --package ../tree-view --home "$RUNNER_TEMP/tree-view-home" --github-env "$GITHUB_ENV"
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum npm start -- --test ../tree-view/spec
          else
            npm start -- --test ../tree-view/spec
          fi
